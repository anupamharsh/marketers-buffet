# Netlify detects Next.js and applies its adapter automatically.
# This file only pins the build so local and live behave the same.
[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 needs Node 20.9+. 22 is an LTS release Netlify supports.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
